name: Deploy subsonic-player to GitHub Pages

# Builds the static (SPA) version of https://github.com/VD39/subsonic-player
# and publishes it to this repository's GitHub Pages site.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream branch, tag or commit to build (empty = default branch)
        required: false
        default: ''
  schedule:
    # Pick up upstream changes once a week (Monday 04:00 UTC).
    - cron: '0 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UPSTREAM_REPO: VD39/subsonic-player

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream subsonic-player
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Checkout this repo (patch scripts)
        uses: actions/checkout@v4
        with:
          path: .deploy

      # Sub-path support, client name, audio/service-worker and click fixes.
      # See .github/scripts/patch-upstream.sh for details.
      - name: Patch upstream
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
          CLIENT_NAME: ${{ vars.CLIENT_NAME || 'GithubPlayer' }}
        run: bash .deploy/.github/scripts/patch-upstream.sh

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: |
          export APP_VERSION="$(git rev-parse --short HEAD)"
          export APP_RELEASE_DATE="$(git log -1 --format=%cI)"
          npm run generate
        env:
          SPA_MODE: 'true'
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          # Optional app defaults: set these as repository variables
          # (Settings → Secrets and variables → Actions → Variables).
          # They are baked in at build time, so a change needs a re-deploy.
          # The README's NUXT_PUBLIC_* names are runtime overrides for the
          # Docker image; the unprefixed names used here are read by
          # nuxt.config.ts and also reach the PWA manifest (app name).
          SERVER_URL: ${{ vars.SERVER_URL }}
          MAIN_APP_TITLE: ${{ vars.MAIN_APP_TITLE }}
          LOAD_SIZE: ${{ vars.LOAD_SIZE }}
          IMAGE_SIZE: ${{ vars.IMAGE_SIZE }}
          ENABLE_QUEUE_SYNC: ${{ vars.ENABLE_QUEUE_SYNC }}
          BITRATE: ${{ vars.BITRATE }}
          THEME: ${{ vars.THEME }}
          LAYOUT: ${{ vars.LAYOUT }}
          SCROBBLE_ENABLED: ${{ vars.SCROBBLE_ENABLED }}
          SHOW_PODCASTS: ${{ vars.SHOW_PODCASTS }}
          SHOW_RADIO_STATIONS: ${{ vars.SHOW_RADIO_STATIONS }}
          DELETE_PODCAST_ON_END: ${{ vars.DELETE_PODCAST_ON_END }}
          CROSSFADE_ENABLED: ${{ vars.CROSSFADE_ENABLED }}
          CROSSFADE_DURATION: ${{ vars.CROSSFADE_DURATION }}
          REPLAY_GAIN_MODE: ${{ vars.REPLAY_GAIN_MODE }}

      - name: Add SPA fallback
        run: |
          # GitHub Pages serves 404.html for unknown paths, so deep links
          # (e.g. /music/library) load the app instead of a 404 page.
          # Nuxt usually generates it already; only add it if missing.
          [ -f .output/public/404.html ] \
            || cp .output/public/index.html .output/public/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
