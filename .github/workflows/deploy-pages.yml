name: Deploy subsonic-player to GitHub Pages

# Builds the static (SPA) version of https://github.com/VD39/subsonic-player
# and publishes it to this repository's GitHub Pages site.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream branch, tag or commit to build (empty = default branch)
        required: false
        default: ''
  schedule:
    # Pick up upstream changes once a week (Monday 04:00 UTC).
    - cron: '0 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UPSTREAM_REPO: VD39/subsonic-player

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream subsonic-player
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # Upstream assumes the app is served from "/". A project Pages site is
      # served from "/<repo>/", so prefix the hardcoded root paths.
      - name: Patch hardcoded root paths
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -z "$BASE" ]; then
            echo "Site is served from the domain root; no patching needed."
            exit 0
          fi
          sed -i \
            -e "s#scope: '/'#scope: '$BASE/'#" \
            -e "s#start_url: '/'#start_url: '$BASE/'#" \
            -e "s#navigateFallback: '/'#navigateFallback: '$BASE/'#" \
            -e "s#baseUrl: '/'#baseUrl: '$BASE/'#" \
            -e "s#src: \`/pwa-#src: \`$BASE/pwa-#" \
            -e "s#^    url,\$#    url: '$BASE' + url,#" \
            config/pwa.config.ts
          sed -i "s#href: '/favicon.svg'#href: '$BASE/favicon.svg'#" plugins/head.ts

          # Fail loudly if upstream changed and a pattern no longer matched.
          for pattern in "scope: '$BASE/'" "start_url: '$BASE/'" \
                         "navigateFallback: '$BASE/'" "baseUrl: '$BASE/'" \
                         "$BASE/pwa-" "url: '$BASE' + url"; do
            grep -qF "$pattern" config/pwa.config.ts \
              || { echo "::error::Patch failed for: $pattern"; exit 1; }
          done
          grep -qF "$BASE/favicon.svg" plugins/head.ts \
            || { echo "::error::Patch failed for favicon"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: |
          export APP_VERSION="$(git rev-parse --short HEAD)"
          export APP_RELEASE_DATE="$(git log -1 --format=%cI)"
          npm run generate
        env:
          SPA_MODE: 'true'
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          # Optional settings: set these as repository variables
          # (Settings → Secrets and variables → Actions → Variables).
          MAIN_APP_TITLE: ${{ vars.MAIN_APP_TITLE }}
          SERVER_URL: ${{ vars.SERVER_URL }}
          THEME: ${{ vars.THEME }}
          LAYOUT: ${{ vars.LAYOUT }}
          SHOW_PODCASTS: ${{ vars.SHOW_PODCASTS }}
          SHOW_RADIO_STATIONS: ${{ vars.SHOW_RADIO_STATIONS }}

      - name: Add SPA fallback
        run: |
          # GitHub Pages serves 404.html for unknown paths, so deep links
          # (e.g. /music/library) load the app instead of a 404 page.
          # Nuxt usually generates it already; only add it if missing.
          [ -f .output/public/404.html ] \
            || cp .output/public/index.html .output/public/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
